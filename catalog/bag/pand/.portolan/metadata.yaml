title: Pand (BAG)
description: 'Een pand is de kleinste, bij de totstandkoming functioneel en bouwkundig-constructief zelfstandige
  eenheid die direct en duurzaam met de aarde is verbonden en betreedbaar en afsluitbaar is. Een pand
  heeft zelf geen adres; de verblijfsobjecten in het pand (verblijfsobject.maaktDeelUitVan) hebben een
  adres. Een pand kan nul, één of meer verblijfsobjecten bevatten. Met historie: een rij per voorkomen
  (versie) van een object, sleutel identificatie en voorkomenidentificatie. Dezelfde eigenschappen als
  de collectie [pand](https://bag.ldproxy.net/bag/collections/pand) van de API. Voor agents: [AGENTS.md](AGENTS.md).'
