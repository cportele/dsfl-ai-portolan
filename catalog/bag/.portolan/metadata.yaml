title: Basisregistratie Adressen en Gebouwen (BAG)
description: 'De Basisregistratie Adressen en Gebouwen (BAG) bevat gemeentelijke basisgegevens van alle
  adressen en gebouwen in Nederland, inclusief de historie. Bron: BAG 2.0 Extract van het Kadaster, stand
  8 oktober 2026. Het uittreksel bevat de BAG van de gemeente Amersfoort, met de woonplaatsen Amersfoort,
  Hoogland, Hooglanderveen en Stoutenburg Noord.


  De gegevens van de API [https://bag.ldproxy.net/bag](https://bag.ldproxy.net/bag) als GeoParquet. Voor
  agents: [AGENTS.md](AGENTS.md).'
