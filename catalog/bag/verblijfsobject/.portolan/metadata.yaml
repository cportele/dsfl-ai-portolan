title: Verblijfsobject (BAG)
description: 'Een verblijfsobject is de kleinste binnen een of meer panden gelegen en voor woon-, bedrijfsmatige,
  of recreatieve doeleinden geschikte eenheid van gebruik die ontsloten wordt via een eigen afsluitbare
  toegang vanaf de openbare weg, een erf of een gedeelde verkeersruimte, onderwerp kan zijn van goederenrechtelijke
  rechtshandelingen en in functioneel opzicht zelfstandig is. Bijvoorbeeld een woning, winkel of kantoor.
  Een verblijfsobject is een adresseerbaar object: het heeft een hoofdadres (heeftAlsHoofdadres) en eventueel
  nevenadressen. Met historie: een rij per voorkomen (versie) van een object, sleutel identificatie en
  voorkomenidentificatie. Dezelfde eigenschappen als de collectie [verblijfsobject](https://bag.ldproxy.net/bag/collections/verblijfsobject)
  van de API. Voor agents: [AGENTS.md](AGENTS.md).'
