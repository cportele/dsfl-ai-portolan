title: Nummeraanduiding (BAG)
description: 'Een nummeraanduiding is een door het bevoegde gemeentelijke orgaan als zodanig toegekende
  aanduiding van een verblijfsobject, een standplaats of een ligplaats: het samenstel van postcode, huisnummer,
  huisletter en huisnummertoevoeging. Samen met de naam van de openbare ruimte en de naam van de woonplaats
  vormt de nummeraanduiding het officiële adres. Een nummeraanduiding heeft geen geometrie; de locatie
  is die van het adresseerbare object dat naar de nummeraanduiding verwijst. Met historie: een rij per
  voorkomen (versie) van een object, sleutel identificatie en voorkomenidentificatie. Dezelfde eigenschappen
  als de collectie [nummeraanduiding](https://bag.ldproxy.net/bag/collections/nummeraanduiding) van de
  API. Voor agents: [AGENTS.md](AGENTS.md).'
