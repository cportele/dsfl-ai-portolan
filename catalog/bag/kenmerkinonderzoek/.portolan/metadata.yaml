title: Kenmerk in onderzoek (BAG)
description: 'Een kenmerk (attribuut of relatie) van een BAG-object waarvoor wordt of werd onderzocht
  of het gegeven juist is. Als een gegeven in onderzoek is, mogen gebruikers een ander gegeven gebruiken;
  de bronhouder moet het onderzoek binnen zes maanden afronden. Elk record heeft een eigen geldigheidsperiode,
  los van de versies van het object. Het plaatsen in onderzoek levert een record met inOnderzoek = true;
  het afronden beëindigt dat record en levert een nieuw record met inOnderzoek = false. Kenmerken per
  objecttype: woonplaats: naam, geometrie, status; openbareruimte: naam, type, status, ligt in; nummeraanduiding:
  huisnummer, huisletter, huisnummertoevoeging, postcode, type adresseerbaar object, status, ligt in,
  ligt aan; pand: geometrie, oorspronkelijk bouwjaar, status; verblijfsobject: geometrie, gebruiksdoel,
  oppervlakte, status, maakt deel uit van, heeft als hoofdadres, heeft als nevenadres; standplaats: geometrie,
  status, heeft als hoofdadres, heeft als nevenadres; ligplaats: geometrie, status, heeft als hoofdadres,
  heeft als nevenadres. Met historie: een rij per voorkomen (versie) van een object, sleutel identificatie
  en voorkomenidentificatie. Dezelfde eigenschappen als de collectie [kenmerkinonderzoek](https://bag.ldproxy.net/bag/collections/kenmerkinonderzoek)
  van de API. Voor agents: [AGENTS.md](AGENTS.md).'
