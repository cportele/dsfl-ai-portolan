title: Wijken en buurten 2026 (CBS)
description: 'De gemeenten, wijken en buurten van Nederland per 1 januari 2026 volgens de Wijk- en Buurtkaart
  2026 van het Centraal Bureau voor de Statistiek (CBS). Een gemeente is ingedeeld in wijken, een wijk
  in buurten. De gemeentegrenzen komen uit de Basisregistratie Kadaster. Het uittreksel bevat de gemeente
  Amersfoort met 33 wijken en 145 buurten.


  De gegevens van de API [https://bag.ldproxy.net/wijkenbuurten](https://bag.ldproxy.net/wijkenbuurten)
  als GeoParquet. Voor agents: [AGENTS.md](AGENTS.md).'
