title: Basisregistratie Grootschalige Topografie (BGT)
description: 'De Basisregistratie Grootschalige Topografie (BGT) is de digitale kaart van Nederland op
  het niveau van straten en panden: wegdelen, terreindelen, waterdelen, panden, overige bouwwerken, kunstwerken,
  scheidingen en spoor, en als optionele IMGeo-informatie (plus) ook inrichtingselementen zoals palen,
  putten, kasten, borden, straatmeubilair en bomen. De objecten van het maaiveld (relatieveHoogteligging
  0) dekken het gebied zonder gaten en overlappingen. Bron: BGT-extract van PDOK (CityGML, met historie)
  voor de omgeving van Amersfoort, stand 30 oktober 2026.


  De gegevens van de API [https://bag.ldproxy.net/bgt](https://bag.ldproxy.net/bgt) als GeoParquet. Voor
  agents: [AGENTS.md](AGENTS.md).'
