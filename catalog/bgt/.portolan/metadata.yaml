processing_notes: 'Geladen in PostgreSQL/PostGIS met de scripts van de repository dsfl-ai (https://github.com/cportele/dsfl-ai;
  scripts/load_bgt.py), de database achter de API https://bag.ldproxy.net/bgt. Per objecttype geëxporteerd
  met de scripts van https://github.com/cportele/dsfl-ai-portolan: gen_sql.py leidt de queries af uit
  de feature provider van ldproxy, zodat de kolommen de eigenschappen van de API zijn; export.py schrijft
  de bestanden met GDAL en sorteert ze met gpio langs een Hilbert-curve (GeoParquet 2.0). Bogen zijn benaderd
  door lijnstukken met een maximale afwijking van 1 mm. Kolommen met verwijzingen bevatten alleen de identificatie.'
