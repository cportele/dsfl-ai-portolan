# Weekly: rashid on the published catalog (with the data pass) and the documented queries and
# claim checks against the published data. A failure opens (or updates) one issue, a later
# success closes it.
name: docs-check

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CATALOG_URL: https://dsfl-ai-417829795942-eu-central-1-an.s3.eu-central-1.amazonaws.com/catalog.json
  ISSUE_TITLE: "Scheduled check of the published catalog failed"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.result.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - id: rashid
        continue-on-error: true
        run: uvx rashid==0.4.0 check --all "$CATALOG_URL" | tee rashid.txt
      - id: docs
        continue-on-error: true
        run: uv run tests/check_docs.py catalog --report docs-report.md
      - id: result
        env:
          RASHID: ${{ steps.rashid.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        run: |
          {
            echo "rashid: $RASHID, documented queries: $DOCS"
            echo
            [ -f docs-report.md ] && cat docs-report.md
            echo
            echo '<details><summary>rashid</summary>'
            echo
            echo '```'
            tail -n 100 rashid.txt
            echo '```'
            echo '</details>'
          } > report.md
          if [ "$RASHID" = success ] && [ "$DOCS" = success ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.md

  issue:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.check.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ "$FAILED" = true ]; then
            printf '%s\n\nRun: %s\n' "$(cat report.md)" "$RUN_URL" > body.md
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
            else
              gh issue create --title "$ISSUE_TITLE" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The checks pass again: $RUN_URL"
          fi
